name: Update market data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"     # every 15 minutes, away from the top of the hour
  workflow_dispatch:                  # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download market data
        env:
          IC_CLIENT_ID: ${{ secrets.IC_CLIENT_ID }}
          IC_CLIENT_SECRET: ${{ secrets.IC_CLIENT_SECRET }}
          IC_ACCESS_TOKEN: ${{ secrets.IC_ACCESS_TOKEN }}
          IC_DEMO: ${{ vars.IC_DEMO }}
        run: node scripts/fetch-data.mjs
      - name: Assemble site
        run: cp index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

