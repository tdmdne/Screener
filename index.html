<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Screener</title>
<style>
:root{--bg:#fff;--fg:#14171c;--mut:#6b7280;--line:#e5e7eb;--card:#f4f5f7;--acc:#111827;--accfg:#fff;--g:#0f9d58;--gb:#e3f4ea;--r:#d93025;--rb:#fbe6e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--fg:#e8eaed;--mut:#9aa0a6;--line:#262b33;--card:#181c22;--acc:#e8eaed;--accfg:#0f1216;--g:#46d38a;--gb:#12301f;--r:#ff7b72;--rb:#3a1a18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1216;--fg:#e8eaed;--mut:#9aa0a6;--line:#262b33;--card:#181c22;--acc:#e8eaed;--accfg:#0f1216;--g:#46d38a;--gb:#12301f;--r:#ff7b72;--rb:#3a1a18;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:20px;margin:0}
.tag{font-size:11px;background:var(--card);border:1px solid var(--line);padding:2px 8px;border-radius:99px;color:var(--mut)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}
.mut{color:var(--mut);font-size:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-size:14px}
input,select,button,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input[type=number]{width:110px}
input[type=checkbox]{width:auto}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.chip{margin-right:4px}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);background:var(--card);font-weight:600}
th .h{cursor:pointer}
th .gear{border:0;background:none;padding:0 0 0 6px;color:var(--mut)}
td:first-child,th:first-child{position:sticky;left:0;background:var(--bg);font-weight:600}
th:first-child{background:var(--card)}
.pill{display:inline-block;min-width:62px;text-align:center;padding:2px 8px;border-radius:6px;font-weight:600;background:var(--gb);color:var(--g)}
.pill.b{background:var(--rb);color:var(--r)}
.sqs{display:inline-flex;gap:3px}
.sqs i{width:14px;height:14px;border-radius:3px;background:var(--g)}
.sqs i.b{background:var(--r)}
.na{color:var(--mut)}
.note{color:var(--mut);font-size:12px;margin:10px 2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:380px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:15px}
.box p{margin:0}
.box input:not([type=checkbox]),.box select,textarea{width:100%}
textarea{font:12px ui-monospace,Consolas,monospace}
.row{display:flex;gap:8px;align-items:center}
.row select{width:auto;flex:1}
.sp{flex:1}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tfs{display:flex;flex-wrap:wrap;gap:6px 12px}
.box.wide{max-width:760px}
#cv{height:320px;width:100%}
a.btn{display:inline-block;text-decoration:none;border-radius:8px;padding:7px 12px;border:1px solid var(--acc);background:var(--acc);color:var(--accfg)}
td.sy{cursor:pointer}
td.sy:hover{text-decoration:underline}
.ws{display:grid;gap:12px}
@media (min-width:1000px){.wrap{max-width:1500px}.ws{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}.cpb{position:sticky;top:8px}}
.cpb{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
#cv{height:min(58vh,520px)}
#cv2{height:120px;width:100%}
.row.wrap{flex-wrap:wrap}
.srch{position:relative;margin-left:auto;flex:1;max-width:320px;min-width:170px}
.srch input{width:100%}
#sr{display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;z-index:15;overflow:hidden}
#sr div,#sr a{display:block;padding:9px 10px;color:inherit;text-decoration:none;cursor:pointer;font-size:14px}
#sr div:hover,#sr a:hover{background:var(--card)}
.sqs i.n{background:var(--line)}
.pagination{display:flex;gap:6px;align-items:center;margin-top:8px}
</style></head><body>
<div class="wrap">
<header><h1>My Screener</h1><span class="tag" id="tag">Keyless Auto-Scan</span><span class="mut" id="dst"></span><div class="srch"><input id="sq" placeholder="Search symbol…" autocomplete="off" oninput="srch()" onkeydown="if(event.key==='Enter')srchGo()" onblur="setTimeout(hideSrBox,150)"><div id="sr"></div></div></header>
<section class="ctl"><select id="ps" onchange="pick(this.value)"></select><button onclick="saveCur()">Save</button><button onclick="saveAs()">Save as…</button><button id="del" onclick="delP()">Delete</button><button onclick="xfer()">Export/Import</button><span class="mut" id="msg"></span></section>
<section class="ctl">
<label>Account size<input id="acct" type="number" inputmode="numeric"></label>
<label>Multiplier<select id="mult"><option>10</option><option>50</option><option>100</option></select></label>
<span class="mut" id="cut"></span>
<label class="chk"><input type="checkbox" id="dvOn">Dollar volume filter</label>
<label class="chk"><input type="checkbox" id="hideNV">Hide FX/CFD</label>
</section>
<section class="ctl"><div id="chips"></div><input id="q" placeholder="Filter table…"><button onclick="openCols()">Columns</button><button onclick="dataM()">Data</button></section>
<div class="ws"><div><div class="tw"><table id="t"></table></div>
<div class="ctl" style="justify-content:space-between"><p class="note" id="cnt" style="margin:0"></p><div class="pagination" id="pag"></div></div></div><div id="cp"></div></div>
<p class="note">Keyless auto-scan loads thousands of markets seamlessly (10 per page). Tap any symbol to open its chart.</p>
</div>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const TFS=["1m","5m","15m","30m","1H","4H","1D"];
const TS={"1m":.05,"5m":.1,"15m":.17,"30m":.24,"1H":.35,"4H":.7,"1D":1};
const SAMPLE=[["EURUSD","FX",1.085,0,1,.005],["GBPUSD","FX",1.271,0,1,.006],["USDJPY","FX",151.2,0,1,.006],["AUDUSD","FX",.654,0,1,.006],["USDCAD","FX",1.365,0,1,.005],["NZDUSD","FX",.592,0,1,.006],
["ES","FUT",5800,1200000,50,.01],["NQ","FUT",20400,600000,20,.013],["CL","FUT",71.5,350000,1000,.02],["GC","FUT",2680,200000,100,.011],["ZN","FUT",110.5,1500000,1000,.004],["6E","FUT",1.085,200000,125000,.005],
["AAPL","STK",225,50000000,1,.016],["NVDA","STK",140,220000000,1,.03],["TSLA","STK",320,80000000,1,.035],["AMD","STK",150,45000000,1,.028],["PLTR","STK",60,60000000,1,.04],["SMCI","STK",30,40000000,1,.05],["MARA","STK",20,30000000,1,.05],["SOFI","STK",14,40000000,1,.035],["THIN","STK",8.4,220000,1,.045],["TINY","STK",2.5,150000,1,.06],
["US30","CFD",43500,0,1,.008],["DE40","CFD",19300,0,1,.009],["UK100","CFD",8100,0,1,.007],["BTCUSD","CRY",76000,15000000,1,.03],["USOIL","CFD",71.5,0,1,.02]];
let SYMS=SAMPLE;
const MK={ALL:"All",FX:"Forex",FUT:"Futures",STK:"Stocks",CFD:"CFDs",CRY:"Crypto",ETF:"ETFs"};
const TY={price:"Price",vol:"Volume",dv:"Dollar volume",pct:"Percent change",cc:"Candle change",adr:"Average daily range %",mac:"Moving average close",mat:"Moving average trend"};
const DF={price:()=>({}),vol:()=>({per:"7d"}),dv:()=>({per:"7d"}),pct:()=>({tf:"1D"}),cc:()=>({tf:"1H",n:8,mode:"exp",dir:"bull",min:0}),adr:()=>({n:14}),mac:()=>({tf:"1D",ma:"EMA",len:10}),mat:()=>({tfs:["30m","1H","4H","1D"],ma:"EMA",len:10})};
const mk=(id,t,o)=>Object.assign({id,type:t},DF[t](),o||{});
const base=(cols,sort)=>({acct:300000,mult:10,dvOn:false,hideNV:false,mkt:"ALL",sort,cols});
const BI={"Cheat sheet (candle change)":base([mk("price","price"),mk("dv","dv"),mk("c2","cc",{tf:"1D",n:30,mode:"abs"}),mk("c3","cc"),mk("c4","cc",{dir:"bear"})],{id:"c3",dir:-1}),
"Trend grid":base([mk("price","price"),mk("pct1","pct"),mk("t1","mat"),mk("t2","mat",{len:20}),mk("a1","adr")],{id:"pct1",dir:-1})};
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=cols=>cols.filter(c=>c&&TY[c.type]).map(c=>Object.assign({id:"c"+Math.random().toString(36).slice(2,8)},DF[c.type](),c));
let P={},S=Object.assign({q:"",cur:"",page:1},clone(BI["Cheat sheet (candle change)"])),arm=false;
try{P=JSON.parse(localStorage.getItem("scr2p")||"{}")}catch(e){}
try{const x=JSON.parse(localStorage.getItem("scr2")||"null");if(x&&Array.isArray(x.cols))S=Object.assign(S,x)}catch(e){}
const WL0=[["EUR/USD","FX","FX:EURUSD"],["GBP/USD","FX","FX:GBPUSD"],["USD/JPY","FX","FX:USDJPY"],["BTC/USD","CRY","BINANCE:BTCUSDT"],["ETH/USD","CRY","BINANCE:ETHUSDT"]].map(([td,m,tv])=>({n:td.replace("/",""),m,td,tv}));
const CH0={type:"candle",up:"#0f9d58",dn:"#d93025",bg:"auto",grid:true,tf:"1H",sym:"EURUSD",ind:[{id:"i1",t:"ema",len:10,col:"#f5a623"},{id:"i2",t:"ema",len:20,col:"#4a90e2"}]};
S.cols=norm(S.cols);S.chart=Object.assign(clone(CH0),S.chart||{});S.data=Object.assign({mode:"auto"},S.data||{});S.wl=Array.isArray(S.wl)&&S.wl.length?S.wl:clone(WL0);
function save(){try{localStorage.setItem("scr2",JSON.stringify(S))}catch(e){}}
function saveP(){try{localStorage.setItem("scr2p",JSON.stringify(P))}catch(e){}}
function seed(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gs=r=>Math.sqrt(-2*Math.log(r()||1e-9))*Math.cos(2*Math.PI*r());
const cache={};

async function fetchKeylessMarkets(){
  document.getElementById("dst").textContent = "Loading markets...";
  try {
    const res = await fetch("https://api.binance.com/api/v3/ticker/24hr");
    const data = await res.json();
    if(Array.isArray(data)) {
      const dynamicSyms = [];
      data.forEach(item => {
        const symbol = item.symbol;
        const price = parseFloat(item.lastPrice) || 0;
        const quoteVol = parseFloat(item.quoteVolume) || 0;
        const baseVol = parseFloat(item.volume) || 0;
        if(price > 0) {
          const baseArr = [];
          let p = price * 0.95;
          for(let i=0; i<100; i++){
            p = p * (1 + (Math.random()-0.49)*0.02);
            baseArr.push({t: Date.now() - (100-i)*3600000, o: p, h: p*1.01, l: p*0.99, c: p, v: baseVol/100});
          }
          cache[symbol + "1H"] = baseArr;
          cache[symbol + "1D"] = baseArr;
          const calcBaseVol = price > 0 ? quoteVol / price : 0;
          dynamicSyms.push([symbol, "CRY", price, calcBaseVol, 1, 0.03, symbol, "BINANCE:" + symbol]);
        }
      });
      if(dynamicSyms.length > 0) {
        SYMS = [...SAMPLE, ...dynamicSyms];
      }
    }
  } catch(e) {
    console.log("Using sample fallback", e);
  }
  document.getElementById("dst").textContent = "Loaded " + SYMS.length + " markets.";
  S.page = 1;
  render();
}

function candles(s,tf){const k=s[0]+tf;if(cache[k])return cache[k];
const r=rng(seed(k)),v=s[5]*TS[tf];let p=100,reg=0;const a=[];
for(let i=0;i<250;i++){if(i%25===0)reg=(r()-.5)*v*1.2;const o=p,c=o*(1+reg+gs(r)*v);
a.push({h:Math.max(o,c)*(1+Math.abs(gs(r))*v*.4),l:Math.min(o,c)*(1-Math.abs(gs(r))*v*.4),c});p=c}
const f=s[2]/p;a.forEach(x=>{x.h*=f;x.l*=f;x.c*=f});return cache[k]=a}
function cc(s,c){const a=candles(s,c.tf),n=Math.min(c.n,149),last=a[a.length-1].c;
if(c.mode==="abs"){const ref=a[a.length-1-n].c;return Math.abs(last-ref)/ref*100}
const w=a.slice(-n);if(c.dir==="bull"){const lo=Math.min(...w.map(x=>x.l));return(last-lo)/lo*100}
const hi=Math.max(...w.map(x=>x.h));return(hi-last)/hi*100}
function ma(s,tf,ty,len){const a=candles(s,tf).map(x=>x.c);if(ty==="SMA"){const w=a.slice(-len);return w.reduce((x,y)=>x+y,0)/w.length}
const k=2/(len+1);let e=a[0];for(let i=1;i<a.length;i++)e=a[i]*k+e*(1-k);return e}
const dvOf=s=>s[3]?s[2]*s[3]*s[4]:null;
function calc(s,c){const t=c.type;
if(t==="price")return s[2];
if(t==="vol"||t==="dv"){if(!s[3])return null;const f=c.per==="1d"?.6+.8*rng(seed(s[0]+"v"))():1;const v=s[3]*f;return t==="dv"?v*s[2]*s[4]:v}
if(t==="pct"){const a=candles(s,c.tf),n=a.length;return(a[n-1].c-a[n-2].c)/a[n-2].c*100}
if(t==="cc")return cc(s,c);
if(t==="adr"){const a=candles(s,"1D").slice(-c.n);return a.reduce((x,y)=>x+(y.h-y.l)/y.c,0)/a.length*100}
if(t==="mac"){const m=ma(s,c.tf,c.ma,c.len),a=candles(s,c.tf);return(a[a.length-1].c-m)/m*100}
return null}
const fm=x=>x==null?"n/a":x>=1e9?(x/1e9).toFixed(1)+"B":x>=1e6?(x/1e6).toFixed(1)+"M":(x/1e3).toFixed(0)+"K";
const fp=p=>p.toFixed(p<5?4:p<1000?2:1);
function label(c){const t=c.type;
if(t==="vol"||t==="dv")return(t==="vol"?"Volume":"Dollar vol")+" · "+c.per.toUpperCase();
if(t==="pct")return"% change · "+c.tf;
if(t==="cc")return c.n+" candle · "+(c.mode==="abs"?"Absolute":"Exp "+(c.dir==="bull"?"bull":"bear"))+" · "+c.tf;
if(t==="adr")return"ADR % · "+c.n+"d";
if(t==="mac")return"MA close · "+c.ma+" "+c.len+" · "+c.tf;
if(t==="mat")return"MA trend · "+c.ma+" "+c.len+" "+c.tfs.join(" ");
return TY[t]}
function rows(vis){const cut=S.acct*S.mult;
let r=SYMS.filter(s=>(S.mkt==="ALL"||s[1]===S.mkt)&&s[0].toLowerCase().includes(S.q.toLowerCase()));
r=r.map(s=>{const o={s,v:{},sq:{}};vis.forEach(c=>{if(c.type==="mat"){o.sq[c.id]=c.tfs.map(t=>safe(()=>{const a=candles(s,t);return a[a.length-1].c>ma(s,t,c.ma,c.len)}));o.v[c.id]=o.sq[c.id].filter(x=>x===true).length}else o.v[c.id]=safe(()=>calc(s,c))});return o});
r=r.filter(o=>{const d=dvOf(o.s);if(d==null&&S.hideNV)return false;if(S.dvOn&&d!=null&&d<cut)return false;
for(const c of vis)if(c.type==="cc"&&c.min>0&&o.v[c.id]<c.min)return false;return true});
const id=S.sort.id,d=S.sort.dir,g=o=>id==="sym"?o.s[0]:o.v[id];
r.sort((a,b)=>{const x=g(a),y=g(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return(x>y?1:x<y?-1:0)*d});return r}
function cell(o,c){const v=o.v[c.id],t=c.type;
if(t==="price")return o.s[2]==null?"…":fp(o.s[2]);
if(t==="vol"||t==="dv")return v==null?`<span class="na">n/a</span>`:(t==="dv"?"$":"")+fm(v);
if(t==="mat")return`<span class="sqs">${o.sq[c.id].map(b=>`<i class="${b===true?"":b===false?"b":"n"}"></i>`).join("")}</span>`;
if(v==null)return`<span class="na">…</span>`;
const bear=(t==="cc"&&c.mode==="exp"&&c.dir==="bear")||((t==="pct"||t==="mac")&&v<0);
return`<span class="pill ${bear?"b":""}">${(t==="pct"||t==="mac")&&v>0?"+":""}${v.toFixed(2)}%</span>`}
const safe=f=>{try{const x=f();return x===true||x===false?x:Number.isFinite(x)?x:null}catch(e){return null}};
function render(){
const vis=S.cols.filter(c=>!c.hide);
if(S.sort.id!=="sym"&&!vis.some(c=>c.id===S.sort.id))S.sort={id:"sym",dir:1};
document.getElementById("cut").textContent="Cutoff: $"+fm(S.acct*S.mult);
document.getElementById("chips").innerHTML=Object.keys(MK).filter(k=>k==="ALL"||SYMS.some(s=>s[1]===k)).map(k=>`<button class="chip ${S.mkt===k?"on":""}" onclick="S.mkt='${k}';S.page=1;save();render()">${MK[k]}</button>`).join("");
const o=k=>`<option value="${esc(k)}" ${S.cur===k?"selected":""}>${esc(k)}</option>`;
document.getElementById("ps").innerHTML=`<option value="">Working copy</option><optgroup label="Built-in">${Object.keys(BI).map(o).join("")}</optgroup><optgroup label="My presets">${Object.keys(P).map(o).join("")}</optgroup>`;
const del=document.getElementById("del");del.textContent=arm?"Confirm?":"Delete";del.disabled=!(S.cur&&P[S.cur]);
const ar=id=>S.sort.id===id?(S.sort.dir<0?" ▼":" ▲"):"";
let h=`<tr><th><span class="h" onclick="srt('sym')">Symbol${ar("sym")}</span></th>`;
vis.forEach(c=>{h+=`<th><span class="h" onclick="srt('${c.id}')">${label(c)}${ar(c.id)}</span><button class="gear" onclick="openEd('${c.id}')" aria-label="Edit column">⚙</button></th>`});

const R=rows(vis);
const pageSize=10;
const totalPages=Math.ceil(R.length/pageSize)||1;
if(S.page>totalPages)S.page=totalPages;
if(S.page<1)S.page=1;
const pageRows=R.slice((S.page-1)*pageSize, S.page*pageSize);

let b="";
pageRows.forEach(r=>{b+=`<tr><td class="sy" onclick="openChart('${r.s[0]}')">${r.s[0]} <span class="mut">${r.s[1]}</span></td>`+vis.map(c=>`<td>${cell(r,c)}</td>`).join("")+"</tr>"});
document.getElementById("t").innerHTML="<thead>"+h+"</tr></thead><tbody>"+b+"</tbody>";
document.getElementById("cnt").textContent="Showing "+(R.length?((S.page-1)*pageSize+1):0)+"-"+Math.min(S.page*pageSize,R.length)+" of "+R.length+" filtered (Total: "+SYMS.length+")";

let pagH=`<button ${S.page<=1?"disabled":""} onclick="S.page--;render()">Prev</button><span>Page ${S.page} of ${totalPages}</span><button ${S.page>=totalPages?"disabled":""} onclick="S.page++;render()">Next</button>`;
document.getElementById("pag").innerHTML=pagH;
}
function srt(id){S.sort=S.sort.id===id?{id,dir:-S.sort.dir}:{id,dir:id==="sym"?1:-1};S.page=1;save();render()}
const MD=document.getElementById("modal");
let ch=null,ch2=null;
function modal(h){MD.innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="box">${h}</div></div>`}
function closeM(){MD.innerHTML=""}
function toast(t){const m=document.getElementById("msg");m.textContent=t;setTimeout(()=>{m.textContent=""},2200)}
const sel=(k,arr,v,lab)=>`<label>${lab}<select data-k="${k}">${arr.map(a=>{const[x,y]=Array.isArray(a)?a:[a,a];return`<option value="${x}" ${x==v?"selected":""}>${y}</option>`}).join("")}</select></label>`;
const num=(k,v,lab,mn,mx,st)=>`<label>${lab}<input data-k="${k}" data-n="1" type="number" min="${mn}" max="${mx}" step="${st||1}" value="${v}"></label>`;
function form(c){const t=c.type;let h="";
if(t==="vol"||t==="dv")h+=sel("per",[["1d","1 day"],["7d","7-day average"]],c.per,"Period");
if(t==="pct"||t==="cc"||t==="mac")h+=sel("tf",TFS,c.tf,"Timeframe");
if(t==="cc")h+=num("n",c.n,"Lookback (candles)",2,149)+sel("mode",[["abs","Absolute"],["exp","Expansion"]],c.mode,"Type")+sel("dir",[["bull","Bullish"],["bear","Bearish"]],c.dir,"Direction (expansion)")+num("min",c.min,"Show only above (%)",0,1000,.1);
if(t==="adr")h+=num("n",c.n,"Lookback (days)",2,100);
if(t==="mac"||t==="mat")h+=sel("ma",["EMA","SMA"],c.ma,"Type")+sel("len",[10,20,50,100,200],c.len,"Length");
if(t==="mat")h+=`<div class="mut">Timeframes</div><div class="tfs">${TFS.map(x=>`<label class="chk"><input type="checkbox" data-tf="${x}" ${c.tfs.includes(x)?"checked":""}>${x}</label>`).join("")}</div>`;
return h||`<p class="mut">No settings for this column.</p>`}
let ed=null;
function openEd(id){const c=S.cols.find(x=>x.id===id);ed=id;
modal(`<h3>${TY[c.type]}</h3>${form(c)}<div class="row"><button onclick="dupCol()">Duplicate</button><button onclick="delCol()">Delete</button><span class="sp"></span><button onclick="closeM()">Cancel</button><button class="pri" onclick="saveEd()">Save</button></div>`)}
function saveEd(){const c=S.cols.find(x=>x.id===ed);
MD.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;c[k]=el.dataset.n?(parseFloat(el.value)||0):(isNaN(el.value)?el.value:Number(el.value))});
if(c.type==="mat"){const t=[...MD.querySelectorAll("[data-tf]")].filter(x=>x.checked).map(x=>x.dataset.tf);c.tfs=t.length?t:["1D"]}
if(c.type==="cc")c.n=Math.max(2,Math.min(149,c.n||8));
if(c.type==="adr")c.n=Math.max(2,Math.min(100,c.n||14));
save();closeM();render()}
function dupCol(){const i=S.cols.findIndex(x=>x.id===ed);S.cols.splice(i+1,0,Object.assign(clone(S.cols[i]),{id:"c"+Date.now()}));save();closeM();render()}
function delCol(){S.cols=S.cols.filter(x=>x.id!==ed);save();closeM();render()}
function openCols(){modal(`<h3>Columns</h3><div class="list">${S.cols.map(c=>`<div class="li"><label class="chk"><input type="checkbox" ${c.hide?"":"checked"} onchange="togCol('${c.id}')">${label(c)}</label><button onclick="openEd('${c.id}')">⚙</button></div>`).join("")}</div><div class="row"><select id="addT">${Object.keys(TY).map(k=>`<option value="${k}">${TY[k]}</option>`).join("")}</select><button onclick="addCol()">Add</button></div><div class="row"><span class="sp"></span><button class="pri" onclick="closeM()">Done</button></div>`)}
function togCol(id){const c=S.cols.find(x=>x.id===id);c.hide=!c.hide;save();render()}
function addCol(){const t=document.getElementById("addT").value,c=mk("c"+Date.now(),t);S.cols.push(c);save();render();openEd(c.id)}
const STEP={"1m":60,"5m":300,"15m":900,"30m":1800,"1H":3600,"4H":14400,"1D":86400};
const INT={"1m":"1","5m":"5","15m":"15","30m":"30","1H":"60","4H":"240","1D":"D"};
const TVS={EURUSD:"FX:EURUSD",GBPUSD:"FX:GBPUSD",USDJPY:"FX:USDJPY"};
const emaArr=(a,len)=>{const k=2/(len+1);let e=a[0];return a.map((x,i)=>i?(e=x*k+e*(1-k)):e)};
const IND={ema:"EMA",sma:"SMA",bb:"Bollinger Bands",vol:"Volume",rsi:"RSI"};
const IL=d=>IND[d.t]+(d.t==="vol"?"":" "+d.len);
const smaArr=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);
function rsiArr(a,n){const o=a.map(()=>null);let g=0,l=0;for(let i=1;i<a.length;i++){const d=a[i]-a[i-1],u=Math.max(d,0),w=Math.max(-d,0);
if(i<=n){g+=u/n;l+=w/n}else{g=(g*(n-1)+u)/n;l=(l*(n-1)+w)/n}
if(i>=n)o[i]=l===0?100:100-100/(1+g/l)}return o}
function vols(s,tf){const a=candles(s,tf),r=rng(seed(s[0]+tf+"V"));return a.map((x,i)=>{const p=i?a[i-1].c:x.c;return(.5+r())*(1+Math.abs(x.c/p-1)/(s[5]*TS[tf]))*1000})}
function killCharts(){[ch,ch2].forEach(c=>{if(c)c.remove()});ch=ch2=null}
function pal(){const cs=getComputedStyle(document.documentElement),v=k=>cs.getPropertyValue(k).trim(),b=S.chart.bg;
return b==="dark"?{bg:"#131722",tx:"#9aa0a6",gr:"#262b33"}:b==="light"?{bg:"#ffffff",tx:"#6b7280",gr:"#e5e7eb"}:{bg:v("--bg"),tx:v("--mut"),gr:v("--line")}}
function openChart(sym,tf){S.chart.sym=sym;if(tf)S.chart.tf=tf;save();drawChart();if(innerWidth<1000)document.getElementById("cp").scrollIntoView({behavior:"smooth",block:"start"})}
function drawChart(){killCharts();const C=S.chart,cp=document.getElementById("cp");
let s=SYMS.find(x=>x[0]===C.sym);if(!s){s=SYMS[0];C.sym=s[0]}
const tv=s[7]||TVS[s[0]]||s[0],hasR=C.ind.some(d=>d.t==="rsi");
cp.innerHTML=`<div class="cpb"><div class="row wrap"><b class="sp">${s[0]} <span class="mut">${MK[s[1]]}</span></b><button onclick="indM()">Indicators</button><button onclick="setM()">Settings</button><a class="btn" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(tv)}&interval=${INT[C.tf]}" target="_blank" rel="noopener">TradingView ↗</a></div><div class="tfs">${TFS.map(t=>`<button class="chip ${t===C.tf?"on":""}" onclick="S.chart.tf='${t}';save();drawChart()">${t}</button>`).join("")}</div><div id="cv"></div>${hasR?`<div id="cv2"></div>`:""}<p class="mut">Indicators calculated locally.</p></div>`;
if(!window.LightweightCharts){document.getElementById("cv").innerHTML=`<p class="mut">The chart library didn’t load.</p>`;return}
const p=pal(),L=window.LightweightCharts,op=()=>({autoSize:true,layout:{background:{type:"solid",color:p.bg},textColor:p.tx},grid:{vertLines:{visible:C.grid,color:p.gr},horzLines:{visible:C.grid,color:p.gr}},timeScale:{timeVisible:C.tf!=="1D",borderColor:p.gr},rightPriceScale:{borderColor:p.gr}});
ch=L.createChart(document.getElementById("cv"),op());
const a=candles(s,C.tf),st=STEP[C.tf],now=Math.floor(Date.now()/1000/st)*st,T=i=>a[i].t||now-(a.length-1-i)*st,cl=a.map(x=>x.c);
const pts=arr=>arr.map((y,i)=>y==null?null:{time:T(i),value:y}).filter(Boolean);
const D=a.map((x,i)=>{const q=x.o!=null?x.o:i?a[i-1].c:x.c;return{time:T(i),open:q,high:Math.max(x.h,q,x.c),low:Math.min(x.l,q,x.c),close:x.c}});
if(C.type==="line")ch.addLineSeries({color:C.up,lineWidth:2}).setData(D.map(x=>({time:x.time,value:x.close})));
else if(C.type==="area")ch.addAreaSeries({lineColor:C.up,topColor:C.up+"66",bottomColor:C.up+"05"}).setData(D.map(x=>({time:x.time,value:x.close})));
else if(C.type==="bars")ch.addBarSeries({upColor:C.up,downColor:C.dn}).setData(D);
else{const h=C.type==="hollow";ch.addCandlestickSeries({upColor:h?"rgba(0,0,0,0)":C.up,downColor:C.dn,borderUpColor:C.up,borderDownColor:C.dn,wickUpColor:C.up,wickDownColor:C.dn}).setData(D)}
const ls=(col,w)=>ch.addLineSeries({color:col,lineWidth:w,priceLineVisible:false,lastValueVisible:false});
C.ind.forEach(d=>{
if(d.t==="ema")ls(d.col,2).setData(pts(emaArr(cl,d.len)));
else if(d.t==="sma")ls(d.col,2).setData(pts(smaArr(cl,d.len)));
else if(d.t==="bb"){const m=smaArr(cl,d.len),sd=cl.map((_,i)=>i<d.len-1?null:Math.sqrt(cl.slice(i-d.len+1,i+1).reduce((q,x)=>q+(x-m[i])**2,0)/d.len));
[1,-1].forEach(g=>ls(d.col,1).setData(pts(m.map((x,i)=>x==null?null:x+g*2*sd[i]))))}
else if(d.t==="vol"){const h=ch.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:"",lastValueVisible:false,priceLineVisible:false});h.priceScale().applyOptions({scaleMargins:{top:.8,bottom:0}});
h.setData(vols(s,C.tf).map((x,i)=>({time:T(i),value:x,color:(D[i].close>=D[i].open?C.up:C.dn)+"66"})))}});
if(hasR){ch2=L.createChart(document.getElementById("cv2"),op());const r=C.ind.find(d=>d.t==="rsi"),rs=ch2.addLineSeries({color:r.col,lineWidth:2,priceLineVisible:false});rs.setData(pts(rsiArr(cl,r.len)));
[70,30].forEach(v=>rs.createPriceLine({price:v,color:p.tx,lineWidth:1,lineStyle:2,axisLabelVisible:false}));
let busy=0;const sy=(x,y)=>x.timeScale().subscribeVisibleLogicalRangeChange(rg=>{if(rg&&!busy){busy=1;y.timeScale().setVisibleLogicalRange(rg);busy=0}});sy(ch,ch2);sy(ch2,ch)}
ch.timeScale().setVisibleLogicalRange({from:a.length-110,to:a.length+4})}
function setM(){const C=S.chart,op=(arr,v)=>arr.map(([k,n])=>`<option value="${k}" ${v===k?"selected":""}>${n}</option>`).join("");
modal(`<h3>Chart settings</h3><label>Chart type<select id="cs_t">${op([["candle","Candles"],["hollow","Hollow candles"],["bars","Bars"],["line","Line"],["area","Area"]],C.type)}</select></label><label>Canvas background<select id="cs_b">${op([["auto","Match app theme"],["dark","Dark"],["light","Light"]],C.bg)}</select></label><div class="row"><label>Up color<input id="cs_u" type="color" value="${C.up}"></label><label>Down color<input id="cs_d" type="color" value="${C.dn}"></label></div><label class="chk"><input id="cs_g" type="checkbox" ${C.grid?"checked":""}>Grid lines</label><div class="row"><span class="sp"></span><button onclick="closeM()">Cancel</button><button class="pri" onclick="setSave()">Apply</button></div>`)}
function setSave(){const g=i=>document.getElementById(i),C=S.chart;C.type=g("cs_t").value;C.bg=g("cs_b").value;C.up=g("cs_u").value;C.dn=g("cs_d").value;C.grid=g("cs_g").checked;save();closeM();drawChart()}
function indM(){const C=S.chart;
modal(`<h3>Indicators</h3><div class="list">${C.ind.length?C.ind.map(d=>`<div class="li"><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${d.col}"></i> ${IL(d)}</span><button onclick="rmInd('${d.id}')">Remove</button></div>`).join(""):`<p class="mut">None added.</p>`}</div><div class="row"><select id="in_t">${Object.keys(IND).map(k=>`<option value="${k}">${IND[k]}</option>`).join("")}</select><input id="in_l" type="number" min="2" max="200" value="20" style="width:80px"><input id="in_c" type="color" value="#f5a623" style="width:52px;padding:2px"></div><div class="row"><span class="sp"></span><button onclick="addInd()">Add</button><button class="pri" onclick="closeM()">Done</button></div>`)}
function addInd(){const g=i=>document.getElementById(i).value;S.chart.ind.push({id:"i"+Date.now(),t:g("in_t"),len:Math.max(2,Math.min(200,parseInt(g("in_l"))||20)),col:g("in_c")});save();drawChart();indM()}
function rmInd(id){S.chart.ind=S.chart.ind.filter(d=>d.id!==id);save();drawChart();indM()}
function srch(){const q=document.getElementById("sq").value.trim().toUpperCase(),b=document.getElementById("sr");if(!q){b.style.display="none";return}
b.innerHTML=SYMS.filter(s=>s[0].includes(q)).slice(0,8).map(s=>`<div onmousedown="openChart('${s[0]}');hideSr()">${s[0]} <span class="mut">${MK[s[1]]}</span></div>`).join("")+`<a href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(q)}" target="_blank" rel="noopener">Look up “${esc(q)}” on TradingView ↗</a>`;b.style.display="block"}
function srchGo(){const q=document.getElementById("sq").value.trim().toUpperCase(),m=SYMS.find(s=>s[0].includes(q));if(q&&m){openChart(m[0]);hideSr()}}
function hideSrBox(){document.getElementById("sr").style.display="none"}
function hideSr(){hideSrBox();document.getElementById("sq").value=""}
function dataM(){modal(`<h3>Data Status</h3><p class="mut">Auto-scanning public markets keyless. No registration needed.</p><div class="row"><button class="pri" onclick="closeM()">Done</button></div>`)}
function sync(){document.getElementById("acct").value=S.acct;document.getElementById("mult").value=S.mult;document.getElementById("dvOn").checked=S.dvOn;document.getElementById("hideNV").checked=S.hideNV;document.getElementById("q").value=S.q}
function pick(n){if(!n){S.cur="";save();render();return}
const p=BI[n]||P[n];if(!p)return;Object.assign(S,clone(p),{cur:n});S.cols=norm(S.cols);S.chart=Object.assign(clone(CH0),S.chart);S.page=1;sync();save();render();drawChart()}
const snap=()=>clone({acct:S.acct,mult:S.mult,dvOn:S.dvOn,hideNV:S.hideNV,mkt:S.mkt,sort:S.sort,cols:S.cols,chart:S.chart});
function saveCur(){if(S.cur&&P[S.cur]){P[S.cur]=snap();saveP();toast("Saved “"+S.cur+"”")}else saveAs()}
function saveAs(){modal(`<h3>Save preset</h3><label>Name<input id="pn" maxlength="40" value="${S.cur&&P[S.cur]?esc(S.cur):""}"></label><div class="row"><span class="sp"></span><button onclick="closeM()">Cancel</button><button class="pri" onclick="doAs()">Save</button></div>`)}
function doAs(){const n=document.getElementById("pn").value.trim();if(!n||BI[n]){document.getElementById("pn").placeholder="Pick a different name";document.getElementById("pn").value="";return}
P[n]=snap();S.cur=n;saveP();save();closeM();render();toast("Saved “"+n+"”")}
function delP(){if(!S.cur||!P[S.cur])return;if(!arm){arm=true;render();setTimeout(()=>{arm=false;render()},3000);return}
arm=false;delete P[S.cur];S.cur="";saveP();save();render()}
function xfer(){modal(`<h3>Export / import presets</h3><p class="mut">Presets live in this browser only.</p><textarea id="xt" rows="7" placeholder="Paste presets text here…"></textarea><div class="row"><button onclick="document.getElementById('xt').value=JSON.stringify(P)">Fill with mine</button><button onclick="imp()">Import</button><span class="sp"></span><button class="pri" onclick="closeM()">Close</button></div><div class="mut" id="xm"></div>`)}
function imp(){const m=document.getElementById("xm");try{const o=JSON.parse(document.getElementById("xt").value);let n=0;
for(const k in o)if(o[k]&&Array.isArray(o[k].cols)&&!BI[k]){P[k]=o[k];n++}
saveP();render();m.textContent="Imported "+n+" preset(s)."}catch(e){m.textContent="Couldn’t read that text."}}
document.getElementById("acct").oninput=e=>{S.acct=parseFloat(e.target.value)||0;S.page=1;save();render()};
document.getElementById("mult").onchange=e=>{S.mult=parseInt(e.target.value);S.page=1;save();render()};
document.getElementById("dvOn").onchange=e=>{S.dvOn=e.target.checked;S.page=1;save();render()};
document.getElementById("hideNV").onchange=e=>{S.hideNV=e.target.checked;S.page=1;save();render()};
document.getElementById("q").oninput=e=>{S.q=e.target.value;S.page=1;save();render()};
if(S.cur&&!BI[S.cur]&&!P[S.cur])S.cur="";
sync();render();drawChart();
fetchKeylessMarkets();
</script></body></html>
