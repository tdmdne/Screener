<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Screener</title>
  <style>
    :root {
      --bg:#ffffff; --fg:#111827; --mut:#6b7280; --line:#e5e7eb; --card:#f3f4f6; --accent:#111827;
      --good:#0f9d58; --bad:#d93025; --good-bg:#e3f4ea; --bad-bg:#fbe6e4;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
    header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    h1 { margin:0; font-size:22px; }
    .tag { font-size:11px; background:var(--card); border:1px solid var(--line); border-radius:99px; color:var(--mut); padding:3px 9px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .mut { color:var(--mut); font-size:12px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
    input, select, button { font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px; color:var(--fg); background:var(--bg); }
    button { cursor:pointer; }
    button.primary { background:var(--accent); color:white; border-color:var(--accent); }
    .table-wrap { border:1px solid var(--line); border-radius:12px; overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:900px; }
    th, td { padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    th { background:var(--card); font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--mut); }
    td:first-child, th:first-child { position:sticky; left:0; background:var(--bg); }
    .pill { display:inline-block; min-width:66px; text-align:center; padding:2px 8px; border-radius:6px; font-weight:600; background:var(--good-bg); color:var(--good); }
    .pill.bad { background:var(--bad-bg); color:var(--bad); }
    .status { margin-top: 8px; color:var(--mut); }
    .chart { width:100%; height:280px; border:1px solid var(--line); border-radius:12px; margin-top:14px; padding:12px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>My Screener</h1>
      <span class="tag" id="tag">Sample data</span>
      <div class="mut" id="statusText">Ready</div>
    </header>

    <div class="toolbar">
      <select id="marketFilter"></select>
      <input id="search" type="text" placeholder="Search symbol..." />
      <select id="rows"> <option value="10">10 rows</option> <option value="25">25 rows</option> <option value="50">50 rows</option> <option value="100">100 rows</option> </select>
      <button class="primary" id="toggleLive">Use live data</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="toolbar" style="margin-top:12px;">
      <button id="prevPage">Prev</button>
      <span id="pageInfo" class="mut">Page 1</span>
      <button id="nextPage">Next</button>
    </div>

    <div class="status" id="loadStatus">Loading queued symbols: 0</div>
    <div class="chart" id="chartBox">Chart placeholder</div>
  </div>

  <script>
    const SAMPLE = [
      ["EURUSD","FX",1.085,0,1,0.005],
      ["GBPUSD","FX",1.271,0,1,0.006],
      ["USDJPY","FX",151.2,0,1,0.006],
      ["AUDUSD","FX",0.654,0,1,0.006],
      ["USDCAD","FX",1.365,0,1,0.005],
      ["NZDUSD","FX",0.592,0,1,0.006],
      ["AAPL","STK",225,50000000,1,0.016],
      ["MSFT","STK",430,120000000,1,0.014],
      ["NVDA","STK",140,220000000,1,0.030],
      ["TSLA","STK",320,80000000,1,0.035],
      ["AMZN","STK",175,90000000,1,0.018],
      ["META","STK",510,80000000,1,0.021],
      ["SPY","ETF",520,70000000,1,0.012],
      ["QQQ","ETF",430,80000000,1,0.02],
      ["ES","FUT",5800,1200000,50,0.01],
      ["NQ","FUT",20400,600000,20,0.013],
      ["CL","FUT",71.5,350000,1000,0.02],
      ["GC","FUT",2680,200000,100,0.011],
      ["BTCUSD","CRY",76000,0,1,0.03],
      ["ETHUSD","CRY",3400,0,1,0.03]
    ];

    const MARKETS = ["ALL","FX","STK","ETF","FUT","CRY"];
    const LIVE = {};
    const LT = {};
    const ERR = {};
    const PEND = {};
    const Q = [];
    const QUALITY = { fx: 0.9, stk: 0.92, fut: 0.88, cry: 0.91, etf: 0.9 };

    const state = {
      page: 0,
      rows: 10,
      q: "",
      market: "ALL",
      live: false,
      sortField: "price",
      sortDir: 1
    };

    function isLive() {
      return state.live;
    }

    function seed(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function rng(seedVal) {
      return function() {
        seedVal |= 0;
        seedVal = (seedVal + 0x6D2B79F5) | 0;
        let t = Math.imul(seedVal ^ (seedVal >>> 15), 1 | seedVal);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function safeCall(fn) {
      try {
        const v = fn();
        return typeof v === "number" && Number.isFinite(v) ? v : null;
      } catch {
        return null;
      }
    }

    function candles(sym, tf) {
      const k = sym + "|" + tf;
      if (LIVE[k]) return LIVE[k];
      const random = rng(seed(k));
      const base = sym.includes("USD") ? 0.02 : 0.06;
      const points = [];
      let price = 100;
      for (let i = 0; i < 180; i++) {
        const drift = (random() - 0.5) * base * 3;
        const next = price * (1 + drift + ((random() - 0.5) * 0.015));
        points.push({
          t: i,
          o: price,
          h: Math.max(price, next) * (1 + random() * 0.007),
          l: Math.min(price, next) * (1 - random() * 0.007),
          c: next
        });
        price = next;
      }
      LIVE[k] = points;
      LT[k] = Date.now();
      return points;
    }

    function symbolPrice(sym) {
      const s = allSymbols().find(x => x[0] === sym);
      if (!s) return null;
      return s[2];
    }

    function allSymbols() {
      return state.live ? Object.values(LIVE).length ? SAMPLE : SAMPLE : SAMPLE;
    }

    function priceCell(sym) {
      const s = SAMPLE.find(x => x[0] === sym);
      if (!s) return "n/a";
      return Number(s[2]).toFixed(2);
    }

    function visibleSymbols() {
      const list = SAMPLE.filter(s => {
        const matchMarket = state.market === "ALL" || s[1] === state.market;
        const matchText = s[0].toLowerCase().includes(state.q.toLowerCase());
        return matchMarket && matchText;
      });
      list.sort((a, b) => (a[2] > b[2] ? 1 : -1));
      return list;
    }

    function symbolsOnCurrentPage() {
      const list = visibleSymbols();
      const start = state.page * state.rows;
      return list.slice(start, start + state.rows);
    }

    function renderTable() {
      const symbols = symbolsOnCurrentPage();
      const rows = [
        ["Symbol", "Market", "Price", "Vol", "Change %"],
      ];

      const header = rows[0].map((h, index) => `<th>${h}</th>`).join("");
      document.getElementById("thead").innerHTML = `<tr>${header}</tr>`;

      const body = symbols.map((s) => {
        const price = s[2];
        const change = safeCall(() => {
          const arr = candles(s[0], "1D");
          const last = arr[arr.length - 1].c;
          const prev = arr[arr.length - 2].c;
          return ((last - prev) / prev) * 100;
        });

        return `<tr>
          <td>${s[0]}</td>
          <td>${s[1]}</td>
          <td>${price}</td>
          <td>${s[3]}</td>
          <td><span class="pill ${change !== null && change < 0 ? "bad" : ""}">${change === null ? "n/a" : change.toFixed(2) + "%"}</span></td>
        </tr>`;
      }).join("");

      document.getElementById("tbody").innerHTML = body;

      const totalPages = Math.max(1, Math.ceil(visibleSymbols().length / state.rows));
      state.page = Math.min(state.page, totalPages - 1);
      document.getElementById("pageInfo").textContent = `Page ${state.page + 1} / ${totalPages}`;
      document.getElementById("loadStatus").textContent = `Loading queued symbols: ${Object.keys(PEND).length}`;
    }

    function need(sym, tf, front = false) {
      const key = sym[0] + "|" + tf;
      if (PEND[key] || ERR[key] || (LIVE[key] && Date.now() - (LT[key] || 0) < 900000)) return;
      PEND[key] = 1;
      const queue = Q;
      if (front) queue.unshift([sym, tf, key]);
      else queue.push([sym, tf, key]);
    }

    function refreshQueue() {
      while (Q.length) {
        const [sym, tf, key] = Q.shift();
        const filtered = SAMPLE.find(x => x[0] === sym[0]);
        if (!filtered) {
          delete PEND[key];
          continue;
        }

        const arr = candles(sym[0], tf);
        LIVE[key] = arr;
        LT[key] = Date.now();
        delete PEND[key];
      }
      renderTable();
    }

    function kick() {
      if (!isLive()) return;
      const symbols = symbolsOnCurrentPage();
      const tfList = ["1D", "1W", "1M"];
      symbols.forEach(sym => {
        tfList.forEach(tf => need(sym, tf));
      });

      const chartTarget = SAMPLE.find(s => s[0] === "EURUSD");
      if (chartTarget) {
        tfList.forEach(tf => need(chartTarget, tf, true));
      }

      refreshQueue();
      document.getElementById("statusText").textContent = isLive() ? "Live data queue" : "Sample data";
      document.getElementById("tag").textContent = isLive() ? "Live" : "Sample data";
    }

    function renderMarketOptions() {
      const select = document.getElementById("marketFilter");
      select.innerHTML = MARKETS.map(m => `<option value="${m}" ${state.market === m ? "selected" : ""}>${m}</option>`).join("");
    }

    function render() {
      renderMarketOptions();
      renderTable();
      document.getElementById("rows").value = String(state.rows);
      document.getElementById("tag").textContent = isLive() ? "Live" : "Sample data";
      document.getElementById("statusText").textContent = isLive() ? "Live data queue" : "Ready";
    }

    function setChartPlaceholder() {
      const box = document.getElementById("chartBox");
      box.innerHTML = `
        <div class="mut">Chart for ${state.q || "EURUSD"}</div>
        <div style="margin-top:8px; font-size:24px; font-weight:600;">EURUSD</div>
        <div style="margin-top:4px; color:${state.live ? "#0f9d58" : "#6b7280"};">${state.live ? "live queue enabled" : "sample mode"}</div>
      `;
    }

    document.getElementById("marketFilter").addEventListener("change", (e) => {
      state.market = e.target.value;
      state.page = 0;
      render();
    });

    document.getElementById("search").addEventListener("input", (e) => {
      state.q = e.target.value;
      state.page = 0;
      render();
    });

    document.getElementById("rows").addEventListener("change", (e) => {
      state.rows = Number(e.target.value);
      state.page = 0;
      render();
    });

    document.getElementById("prevPage").addEventListener("click", () => {
      state.page = Math.max(0, state.page - 1);
      render();
    });

    document.getElementById("nextPage").addEventListener("click", () => {
      const totalPages = Math.max(1, Math.ceil(visibleSymbols().length / state.rows));
      state.page = Math.min(totalPages - 1, state.page + 1);
      render();
    });

    document.getElementById("toggleLive").addEventListener("click", () => {
      state.live = !state.live;
      document.getElementById("toggleLive").textContent = state.live ? "Use sample data" : "Use live data";
      render();
      if (state.live) kick();
    });

    setChartPlaceholder();
    render();
    kick();
  </script>
</body>
</html>
