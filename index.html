<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Screener (Prototype)</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --border: #333;
      --text: #e0e0e0;
      --accent: #2962ff;
      --green: #00c853;
      --red: #ff5252;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: var(--surface);
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 10px;
    }
    button, input, select {
      background: #2a2a2a;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #3a3a3a; }
    #status-bar {
      font-size: 0.9rem;
      color: #aaa;
      margin-left: auto;
    }
    .main-layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 10px;
    }
    @media (max-width: 1000px) {
      .main-layout { grid-template-columns: 1fr; }
    }
    #table-container, #chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 600px;
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th { position: sticky; top: 0; background: #222; z-index: 1; }
    tr:hover { background: rgba(255,255,255,0.03); cursor: pointer; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }
  </style>
</head>
<body>

  <header>
    <strong>My Screener</strong>
    <button onclick="startScan()">Scan Markets</button>
    <button onclick="clearCache()">Clear Cache</button>
    <input type="text" id="search-input" placeholder="Search symbol..." oninput="filterTable()">
    <div id="status-bar">Idle</div>
  </header>

  <div class="main-layout">
    <div id="table-container">
      <table id="screener-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Price</th>
            <th>Change</th>
            <th>Volume</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div id="chart-container"></div>
  </div>

<script>
  // IndexedDB Cache Layer for Persistent Storage across browser loads
  const DB_NAME = "ScreenerCacheDB", STORE_NAME = "candles", DB_VER = 1;
  let dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });

  async function getCached(key) {
    const db = await dbPromise;
    return new Promise(resolve => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  }

  async function setCached(key, val) {
    try {
      const db = await dbPromise;
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put(val, key);
    } catch(e) {}
  }

  async function clearCache() {
    const db = await dbPromise;
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).clear();
    alert("Local cache cleared!");
  }

  // Public CORS Proxy Fallbacks
  const PX = [
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`
  ];

  const YI = { "1d": ["1d", "2y"] };
  let LIVE = {}, QY = [], bz = {};

  // Lightweight Chart Setup
  const chartDom = document.getElementById('chart-container');
  const chart = LightweightCharts.createChart(chartDom, {
    layout: { background: { color: '#1e1e1e' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } }
  });
  const candleSeries = chart.addCandlestickSeries();

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function status(msg) { document.getElementById('status-bar').innerText = msg; }

  async function fetchSymbol(sym, tf = "1d") {
    const cacheKey = `${sym}_${tf}`;
    const cached = await getCached(cacheKey);
    if (cached && (Date.now() - cached.time < 900000)) { // 15 min cache
      return cached.data;
    }

    const [iv, rg] = YI[tf] || ["1d", "2y"];
    
    // 1. Try Cloudflare serverless backend
    try {
      const res = await fetch(`/api/yahoo?symbol=${encodeURIComponent(sym)}&interval=${iv}&range=${rg}`);
      if (res.ok) {
        const json = await res.json();
        const result = json?.chart?.result?.[0];
        if (result && result.timestamp) {
          const parsed = parseYahoo(result);
          await setCached(cacheKey, { time: Date.now(), data: parsed });
          return parsed;
        }
      }
    } catch(e) {}

    // 2. Fallback proxies
    const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=${iv}&range=${rg}`;
    for (const proxy of PX) {
      try {
        const r = await fetch(proxy(targetUrl));
        if (!r.ok) continue;
        const j = await r.json(), c = j?.chart?.result?.[0];
        if (c && c.timestamp) {
          const parsed = parseYahoo(c);
          await setCached(cacheKey, { time: Date.now(), data: parsed });
          return parsed;
        }
      } catch(e) {}
    }
    throw new Error("network error");
  }

  function parseYahoo(c) {
    const ts = c.timestamp, q = c.indicators.quote[0];
    let out = [];
    for (let i = 0; i < ts.length; i++) {
      if (q.open[i] != null) {
        out.push({
          time: ts[i],
          open: q.open[i],
          high: q.high[i],
          low: q.low[i],
          close: q.close[i],
          volume: q.volume[i] || 0
        });
      }
    }
    return out;
  }

  async function startScan() {
    // Representative symbol list (expandable to your full ~360+ list)
    const symbols = ["AAPL", "MSFT", "GOOGL", "AMZN", "TSLA", "EURUSD=X", "GBPUSD=X", "BTC-USD", "ETH-USD", "SPY", "QQQ"];
    QY = [...symbols];
    status(`Scanning ${QY.length} symbols...`);
    
    while(QY.length) {
      const sym = QY.shift();
      status(`Loading ${sym} (${QY.length} left)...`);
      try {
        const data = await fetchSymbol(sym);
        LIVE[sym] = data;
        renderTable();
      } catch(e) {}
      await sleep(150);
    }
    status("Scan complete");
  }

  function renderTable() {
    const tbody = document.getElementById('table-body');
    const query = document.getElementById('search-input').value.toUpperCase();
    tbody.innerHTML = '';
    
    for (const [sym, data] of Object.entries(LIVE)) {
      if (query && !sym.includes(query)) continue;
      if (!data.length) continue;
      
      const last = data[data.length - 1];
      const prev = data[data.length - 2] || last;
      const chg = ((last.close - prev.close) / prev.close) * 100;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${sym}</strong></td>
        <td>${last.close.toFixed(2)}</td>
        <td class="${chg >= 0 ? 'pos' : 'neg'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</td>
        <td>${(last.volume / 1e6).toFixed(2)}M</td>
      `;
      tr.onclick = () => {
        chart.timeScale().fitContent();
        candleSeries.setData(data);
      };
      tbody.appendChild(tr);
    }
  }

  function filterTable() {
    renderTable();
  }

  // Auto-run scan on load
  window.onload = () => {
    startScan();
  };
</script>
</body>
</html>
