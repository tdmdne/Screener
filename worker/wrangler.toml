# Vektor market-data proxy. Deploy from this folder:  cd worker && npx wrangler deploy
# This is a SEPARATE Worker from the root wrangler.toml (name "vektor-terminal"); both can coexist
# while you migrate. Do not reuse the same name or Durable Object class.
name = "vektor-proxy"
main = "index.js"
compatibility_date = "2025-01-01"

# Optional: serve the static frontend from the same Worker (single origin = no CORS at all).
# Uncomment once you want the Worker to be the front door; the path is relative to this file.
# [assets]
# directory = "../"
# binding = "ASSETS"
# run_worker_first = ["/api/*", "/ws", "/sse"]

[vars]
# Comma-separated list. "*" while testing; lock down for production, e.g. "https://app.yourdomain.com,*.pages.dev"
ALLOWED_ORIGINS = "*"

# Secrets are NOT set here. Use:  npx wrangler secret put TWELVEDATA_KEY

[[durable_objects.bindings]]
name = "MARKET_HUB"
class_name = "MarketHub"

[[migrations]]
tag = "v1"
new_classes = ["MarketHub"]
