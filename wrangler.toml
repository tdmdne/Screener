name = "vektor-terminal"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws"]

[[kv_namespaces]]
binding = "SCREENER_KV"
id = "REPLACE_WITH_YOUR_SCREENER_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "MARKET_RELAY"
class_name = "MarketRelayDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MarketRelayDO"]

[triggers]
crons = ["* * * * *"]
